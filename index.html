<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expenses chart component</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="main">
      <div class="balance">
        <div class="my-balance">
          <p>My balance</p>
          <h1>$921.48</h1>
        </div>
        <div class="logo">
          <img src="img/logo.svg" alt="logo" />
        </div>
      </div>
      <div class="chart">
        <h2>Spending - Last 7 days</h2>
        <div class="chart-container">
          <div class="chart-bar" data-day="mon" data-amount="17.45">
            <span class="tooltip">$17.45</span>
          </div>
          <div class="chart-bar" data-day="tue" data-amount="34.91">
            <span class="tooltip">$34.91</span>
          </div>
          <div class="chart-bar" data-day="wed" data-amount="52.36">
            <span class="tooltip">$52.36</span>
          </div>
          <div class="chart-bar" data-day="thu" data-amount="31.07">
            <span class="tooltip">$31.07</span>
          </div>
          <div class="chart-bar" data-day="fri" data-amount="23.39">
            <span class="tooltip">$23.39</span>
          </div>
          <div class="chart-bar" data-day="sat" data-amount="43.28">
            <span class="tooltip">$43.28</span>
          </div>
          <div class="chart-bar" data-day="sun" data-amount="25.48">
            <span class="tooltip">$25.48</span>
          </div>
        </div>
        <hr />
        <div class="summary">
          <div class="total">
            <p>Total this month</p>
            <h1>$478.33</h1>
          </div>
          <div class="result">
            <p><span>+2.4%</span> from last month</p>
          </div>
        </div>
      </div>
    </div>
    <script src="js/script.js"></script>
  </body>
</html>
